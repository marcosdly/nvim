name: Format Lua

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: StyLua
        uses: JohnnyMorganz/stylua-action@v4.0.0
        with:
            token: ${{ secrets.GITHUB_TOKEN }}
            version: latest
            args: --color=Never .
