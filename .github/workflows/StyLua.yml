name: Format Lua

on:
  push:
    branches: [ "master", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: StyLua
        uses: JohnnyMorganz/stylua-action@v4.0.0
        with:
            token: ${{ secrets.GITHUB_TOKEN }}
            version: "2.0.2"
            args: --check .
